<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registrazione</title>
</head>
<body>
    <h2>Crea un nuovo account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Registrati</button>
    </form>
    <p>Hai già un account? <a href="{% url 'login' %}">Accedi qui</a></p>
</body>
</html>
