<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h2>Accedi al tuo account</h2>

    {% if form.errors %}
        <p style="color: red;">Username o password non validi. Riprova.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Accedi</button>
    </form>
</body>
</html>
